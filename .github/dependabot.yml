# Weekly dependency updates, grouped so they arrive as a few PRs, not one per package.
# CI (tests, lint, typecheck, build, browser smoke test) must pass before any is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned majors. Each move is a deliberate change, made by hand, not a weekly bump.
      # CLAUDE.md pins the MCP SDK to 1.x; ext-apps 2.x needs the split v2 SDK (FRICTION_LOG.md).
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-major"]
      # Types must match the Node 22 runtime (package.json engines), or code type-checks against
      # APIs that don't exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
